<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风格2 - 极简Drops风</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0d0d1a;max-width:420px;margin:0 auto;min-height:100vh;color:#e0e0f0}
.top{padding:40px 24px 24px;text-align:center}
.top .logo{font-size:14px;color:#5c5c8a;letter-spacing:3px;text-transform:uppercase;margin-bottom:24px}
.top .streak{font-size:48px;font-weight:200;color:#9b9bff;line-height:1}
.top .streak span{font-size:16px;color:#5c5c8a;display:block;margin-top:4px;font-weight:400}
.list{padding:0 20px;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:14px;padding:16px 14px;border-radius:14px;cursor:pointer;transition:all .2s}
.item:hover{background:rgba(255,255,255,.04)}
.item .icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.item .info{flex:1}
.item .info .name{font-size:15px;font-weight:600;color:#d0d0e8}
.item .info .desc{font-size:12px;color:#5c5c8a;margin-top:2px}
.item .arrow{color:#3c3c5a;font-size:18px}
.item.done{opacity:.35}
.divider{height:1px;background:rgba(255,255,255,.04);margin:4px 14px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:420px;display:flex;padding:12px 20px 28px;gap:2px;background:linear-gradient(transparent,#0d0d1a 40%)}
.bottom button{flex:1;padding:12px;border:none;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#5c5c8a;transition:all .2s}
.bottom .active{background:rgba(155,155,255,.12);color:#9b9bff}
</style></head>
<body>
<div class="top">
  <div class="logo">ENGLEARN</div>
  <div class="streak">7<span>天连续</span></div>
</div>
<div class="list">
  <div class="item">
    <div class="icon" style="background:rgba(155,155,255,.1);color:#9b9bff">📝</div>
    <div class="info"><div class="name">新词学习</div><div class="desc">学习 20 个 CET-4 词汇</div></div>
    <div class="arrow">→</div>
  </div>
  <div class="divider"></div>
  <div class="item done">
    <div class="icon" style="background:rgba(155,255,155,.1);color:#9bff9b">✓</div>
    <div class="info"><div class="name">单词复习</div><div class="desc">已完成</div></div>
    <div class="arrow">→</div>
  </div>
  <div class="divider"></div>
  <div class="item">
    <div class="icon" style="background:rgba(200,155,255,.1);color:#c89bff">🤖</div>
    <div class="info"><div class="name">造句练习</div><div class="desc">中译英 + AI 评分</div></div>
    <div class="arrow">→</div>
  </div>
  <div class="divider"></div>
  <div class="item">
    <div class="icon" style="background:rgba(255,180,100,.1);color:#ffb464">🎯</div>
    <div class="info"><div class="name">介词填空</div><div class="desc">in / on / at 专项</div></div>
    <div class="arrow">→</div>
  </div>
  <div class="divider"></div>
  <div class="item">
    <div class="icon" style="background:rgba(255,120,120,.1);color:#ff7878">🎧</div>
    <div class="info"><div class="name">听写训练</div><div class="desc">听音拼词</div></div>
    <div class="arrow">→</div>
  </div>
  <div class="divider"></div>
  <div class="item">
    <div class="icon" style="background:rgba(100,200,255,.1);color:#64c8ff">🎤</div>
    <div class="info"><div class="name">跟读练习</div><div class="desc">语音识别评分</div></div>
    <div class="arrow">→</div>
  </div>
  <div class="divider"></div>
  <div class="item">
    <div class="icon" style="background:rgba(255,220,100,.1);color:#ffdc64">⭐</div>
    <div class="info"><div class="name">新词巩固</div><div class="desc">快速复习今日新词</div></div>
    <div class="arrow">→</div>
  </div>
</div>
<div class="bottom">
  <button class="active">学习</button>
  <button>统计</button>
</div>
</body></html>
